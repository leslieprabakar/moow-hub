<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Moow.Hub</title>
  <meta name="description" content="Create your Moow.Hub account. Join the global wellness community.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <style>
    @keyframes authFadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(800px 420px at 90% -5%, rgba(255, 94, 98, 0.12) 0%, transparent 60%),
        radial-gradient(700px 380px at -5% 15%, rgba(242, 184, 75, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 0%, var(--bg-warm) 0%, var(--bg) 70%);
      padding: 2rem 1rem;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: 0 4px 30px rgba(15, 61, 62, 0.08), 0 0 0 1px var(--border-light);
      animation: authFadeIn 0.5s ease-out;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--primary), var(--gold));
      pointer-events: none;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo a {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
    }
    .auth-logo .dot {
      color: var(--primary);
    }
    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--navy);
      font-size: 0.9rem;
    }
    .label-icon {
      width: 16px;
      height: 16px;
      color: var(--primary);
      flex-shrink: 0;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(242, 184, 75, 0.12), 0 1px 4px rgba(15, 61, 62, 0.04);
      background: #fefcf9;
    }
    .form-group.error input {
      border-color: #dc3545;
    }
    .error-message {
      color: #dc3545;
      font-size: 0.85rem;
      margin-top: 0.35rem;
      display: none;
    }
    .form-group.error .error-message {
      display: block;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .btn-primary {
      width: 100%;
      padding: 0.875rem;
      background: var(--gradient-sunset);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(255, 94, 98, 0.3);
      margin-top: 0.5rem;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 94, 98, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .alert-error {
      background: #fee;
      color: #dc3545;
      border: 1px solid #fcc;
    }
    .alert-success {
      background: #efe;
      color: #28a745;
      border: 1px solid #cec;
    }
    @media (max-width: 768px) {
      .auth-page { padding: 1.5rem 1rem; }
      .auth-card { padding: 1.5rem; }
      .auth-card::before { height: 3px; }
      .auth-logo a { font-size: 1.5rem; }
      .auth-title { font-size: 1.3rem; }
      .auth-subtitle { font-size: 0.9rem; margin-bottom: 1.5rem; }
      .form-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .auth-page { padding: 1rem 0.75rem; }
      .auth-card { padding: 1.25rem; border-radius: calc(var(--radius) - 2px); }
      .auth-card::before { height: 3px; }
      .auth-logo { margin-bottom: 1.5rem; }
      .auth-logo a { font-size: 1.35rem; }
      .auth-title { font-size: 1.15rem; }
      .auth-subtitle { font-size: 0.85rem; margin-bottom: 1.25rem; }
      .form-group { margin-bottom: 1rem; }
      .form-group label { font-size: 0.85rem; }
      .form-group input { font-size: 0.9rem; padding: 0.65rem 0.85rem; }
      .btn-primary { font-size: 0.9rem; padding: 0.75rem; }
      .auth-footer { font-size: 0.85rem; }
    }
  </style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script><script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <a href="/">Moow<span class="dot">.</span>Hub®</a>
        </div>

        <h1 class="auth-title">Join Moow.Hub</h1>
        <p class="auth-subtitle">Create your account</p>

        <div id="alert" class="alert"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="fullName">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Full name
            </label>
            <input type="text" id="fullName" name="full_name" required autocomplete="name" placeholder="Your full name">
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="email">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              Email address
            </label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="phone">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
              Phone (optional)
            </label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+1 234 567 890">
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="password">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              Password
            </label>
            <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Choose a password">
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              Confirm password
            </label>
            <input type="password" id="confirmPassword" name="confirm_password" required autocomplete="new-password" placeholder="Confirm your password">
            <div class="error-message"></div>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
        </form>

        <p class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    (function() {
      if (Auth.isAuthenticated()) {
        window.location.href = '/home';
        return;
      }

      var form = document.getElementById('registerForm');
      var alertEl = document.getElementById('alert');
      var submitBtn = document.getElementById('submitBtn');

      if (!form || !alertEl || !submitBtn) {
        console.error('Moow: register form elements missing');
        return;
      }

      function showAlert(msg, type) {
        var el = document.getElementById('alert');
        if (!el) return;
        el.textContent = msg;
        el.className = 'alert alert-' + type;
        el.style.display = 'block';
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        alertEl.style.display = 'none';

        var fullName = document.getElementById('fullName').value.trim();
        var email = document.getElementById('email').value.trim();
        var phone = document.getElementById('phone').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!fullName || fullName.length < 2) {
          showAlert('Please enter your full name', 'error');
          return;
        }

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showAlert('Please enter a valid email address', 'error');
          return;
        }

        if (password !== confirmPassword) {
          showAlert('Passwords do not match', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        try {
          await Auth.register(email, password, fullName, phone || undefined, {
            interest_areas: null,
            referral_source: null,
            source_page: 'register-page'
          });
          showAlert('Account created! Please check your email to verify your account.', 'success');
          form.reset();
          setTimeout(function() {
            window.location.href = 'login.html';
          }, 3000);
        } catch (error) {
          showAlert(error && error.message || 'Registration failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    })();
  </script>
</body>
</html>
