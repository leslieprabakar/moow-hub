<!DOCTYPE html>
<html lang="en" data-theme="walnut-latte">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Moow.Hub</title>
  <meta name="description" content="Sign in to your Moow.Hub account. Access your orders, cart, and wellness journey.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <style>
    @keyframes authFadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(800px 420px at 90% -5%, rgba(255, 94, 98, 0.12) 0%, transparent 60%),
        radial-gradient(700px 380px at -5% 15%, rgba(242, 184, 75, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 0%, var(--bg-warm) 0%, var(--bg) 70%);
      padding: 2rem 1rem;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: 0 4px 30px rgba(15, 61, 62, 0.08), 0 0 0 1px var(--border-light);
      animation: authFadeIn 0.5s ease-out;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--primary), var(--gold));
      pointer-events: none;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo a {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
    }
    .auth-logo .dot {
      color: var(--primary);
    }
    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--navy);
      font-size: 0.9rem;
    }
    .label-icon {
      width: 16px;
      height: 16px;
      color: var(--primary);
      flex-shrink: 0;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(242, 184, 75, 0.12), 0 1px 4px rgba(15, 61, 62, 0.04);
      background: #fefcf9;
    }
    .form-group.error input {
      border-color: #dc3545;
    }
    .error-message {
      color: #dc3545;
      font-size: 0.85rem;
      margin-top: 0.35rem;
      display: none;
    }
    .form-group.error .error-message {
      display: block;
    }
    .btn-primary {
      width: 100%;
      padding: 0.875rem;
      background: var(--gradient-sunset);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(255, 94, 98, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 94, 98, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--gold);
      opacity: 0.4;
    }
    .auth-divider span {
      padding: 0 1rem;
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .alert-error {
      background: #fee;
      color: #dc3545;
      border: 1px solid #fcc;
    }
    .alert-success {
      background: #efe;
      color: #28a745;
      border: 1px solid #cec;
    }
    .forgot-link {
      text-align: right;
      margin-top: -0.75rem;
      margin-bottom: 1.25rem;
    }
    .forgot-link a {
      color: var(--text-light);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .forgot-link a:hover {
      color: var(--primary);
    }


    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 2.5rem; }
    .toggle-password { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0.25rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
    .toggle-password:hover { color: var(--navy); }
    .toggle-password svg { width: 18px; height: 18px; display: block; }

    @media (max-width: 768px) {
      .auth-page { padding: 1.5rem 1rem; }
      .auth-card { padding: 1.5rem; }
      .auth-card::before { height: 3px; }
      .auth-logo a { font-size: 1.5rem; }
      .auth-title { font-size: 1.3rem; }
      .auth-subtitle { font-size: 0.9rem; margin-bottom: 1.5rem; }
    }
    @media (max-width: 480px) {
      .auth-page { padding: 1rem 0.75rem; }
      .auth-card { padding: 1.25rem; border-radius: calc(var(--radius) - 2px); }
      .auth-card::before { height: 3px; }
      .auth-logo { margin-bottom: 1.5rem; }
      .auth-logo a { font-size: 1.35rem; }
      .auth-title { font-size: 1.15rem; }
      .auth-subtitle { font-size: 0.85rem; margin-bottom: 1.25rem; }
      .form-group { margin-bottom: 1rem; }
      .form-group label { font-size: 0.85rem; }
      .form-group input { font-size: 0.9rem; padding: 0.65rem 0.85rem; }
      .btn-primary { font-size: 0.9rem; padding: 0.75rem; }
      .auth-footer { font-size: 0.85rem; }
      .forgot-link a { font-size: 0.8rem; }
    }
  </style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script><script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="tp" class="closed tp-fixed" aria-label="Theme switcher">
  <button class="tp-toggle" id="tp-toggle" type="button" aria-expanded="false" aria-controls="tp-panel" title="Theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 3a9 9 0 1 0 0 18h1.5a1.8 1.8 0 0 0 1.4-2.9 1.6 1.6 0 0 1 1.3-2.6H17A4 4 0 0 0 21 11.5C21 6.8 17 3 12 3z"/>
      <circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/>
    </svg>
  </button>
  <div class="tp-panel" id="tp-panel" role="group" aria-label="Choose a theme">
    <div class="tp-head">
      <div class="tp-title">Choose your ambience</div>
      <div class="tp-sub">Eight walnut shades. Saved automatically.</div>
    </div>
    <div class="tp-list">
      <button class="tp-opt" data-theme-btn="walnut-ivory" type="button" style="--sw:#F8F4EC"><span class="tp-swatch"></span><span class="tp-name">Ivory</span></button>
      <button class="tp-opt" data-theme-btn="walnut-cream" type="button" style="--sw:#EDE6D8"><span class="tp-swatch"></span><span class="tp-name">Cream</span></button>
      <button class="tp-opt active" data-theme-btn="walnut-latte" type="button" style="--sw:#D2C7AF"><span class="tp-swatch"></span><span class="tp-name">Latte</span></button>
      <button class="tp-opt" data-theme-btn="walnut-sand" type="button" style="--sw:#B3A488"><span class="tp-swatch"></span><span class="tp-name">Sand</span></button>
      <button class="tp-opt" data-theme-btn="walnut-tan" type="button" style="--sw:#665A46"><span class="tp-swatch"></span><span class="tp-name">Tan</span></button>
      <button class="tp-opt" data-theme-btn="walnut-mid" type="button" style="--sw:#524736"><span class="tp-swatch"></span><span class="tp-name">Mid</span></button>
      <button class="tp-opt" data-theme-btn="walnut-soft" type="button" style="--sw:#3F3629"><span class="tp-swatch"></span><span class="tp-name">Soft</span></button>
      <button class="tp-opt" data-theme-btn="walnut" type="button" style="--sw:#2E261D"><span class="tp-swatch"></span><span class="tp-name">Walnut</span></button>
    </div>
    <div class="tp-foot">Your choice stays with this device.</div>
  </div>
</div>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <a href="/">Moow<span class="dot">.</span>Hub®</a>
        </div>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              Email address
            </label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="">
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="password">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              Password
            </label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="">
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-message"></div>
          </div>

          <div class="forgot-link">
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <p class="auth-footer">
          Don't have an account? <a href="../">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      btn.innerHTML = isPassword
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    (function() {
      if (Auth.isAuthenticated()) {
        window.location.href = '/home';
        return;
      }

      var form = document.getElementById('loginForm');
      var alertEl = document.getElementById('alert');
      var submitBtn = document.getElementById('submitBtn');
      var emailInput = document.getElementById('email');

      if (!form || !alertEl || !submitBtn) {
        console.error('Moow: login form elements missing');
        return;
      }

      function showAlert(msg, type) {
        var el = document.getElementById('alert');
        if (!el) return;
        el.textContent = msg;
        el.className = 'alert alert-' + type;
        el.style.display = 'block';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        alertEl.style.display = 'none';

        var email = emailInput.value.trim();
        var password = document.getElementById('password').value;

        if (!email || !password) {
          showAlert('Please fill in all fields', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          var user = await Auth.login(email, password);
          var redirect = user && user.is_admin ? '/pages/admin/dashboard.html' : '/home';
          window.location.href = redirect;
        } catch (error) {
          console.error('Login failed:', error);
          showAlert(error.message || 'Invalid credentials', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    })();
  </script>
  <script defer src="../js/main.js"></script>
</body>
</html>
