<!DOCTYPE html>
<html lang="en" data-theme="walnut-latte">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products — Moow.Hub Admin</title>
  <meta name="description" content="Manage Moow.Hub product catalog — add, edit, and remove wellness products.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css?v=11">
  <style>
    * { box-sizing: border-box; }
    .admin-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--navy); color: white; padding: 2rem 0; }
    .admin-logo { padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
    .admin-logo a { color: white; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .admin-logo h2 { color: white; font-family: var(--font-serif); font-size: 1.3rem; margin: 0; }
    .admin-logo span { color: var(--primary); }
    .admin-logo-icon { font-size: 1.5rem; flex-shrink: 0; }
    .admin-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; }
    @media (max-width: 768px) {
      .admin-toggle { display: block; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; z-index: 2000; transition: left 0.3s ease; overflow-y: auto; }
      .admin-sidebar.open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.2); }
      .admin-sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
      .admin-sidebar-header .admin-logo { padding: 0; border-bottom: none; margin-bottom: 0; }
      .admin-sidebar-header .admin-toggle { color: white; font-size: 1.5rem; }
      .admin-main { padding: 1rem; }
      .admin-table table { min-width: 500px; }
      .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1999; }
      .admin-overlay.show { display: block; }
    }
    .admin-nav { padding: 0 1rem; }
    .admin-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; color: rgba(255,255,255,0.7); border-radius: var(--radius); margin-bottom: 0.25rem; cursor: pointer; transition: var(--transition); font-size: 0.9rem; text-decoration: none; }
    .admin-nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .admin-nav-item.active { background: var(--primary); color: white; }
    .admin-nav-item svg { width: 18px; height: 18px; }
    
    .admin-main { padding: 2rem; background: var(--bg); min-height: 100vh; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-family: var(--font-serif); color: var(--navy); margin: 0; }
    
    .admin-table { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .admin-table > div { overflow-x: auto; }
    .admin-table table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .admin-table th { background: var(--bg); padding: 1rem; text-align: left; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .admin-table td { padding: 1rem; border-bottom: 1px solid var(--border-light); font-size: 0.9rem; }
    .admin-table tr:hover td { background: var(--bg); }
    
    .product-thumb { width: 50px; height: 50px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg); }
    .stock-low { color: #dc3545; font-weight: 600; }
    .stock-ok { color: #28a745; }
    
    .action-btn { padding: 0.4rem 0.8rem; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; transition: var(--transition); margin-right: 0.25rem; }
    .action-btn-primary { background: var(--primary); color: white; }
    .action-btn-primary:hover { background: var(--primary-hover); }
    .action-btn-danger { background: #dc3545; color: white; }
    .action-btn-danger:hover { background: #c82333; }
    
    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal { background: var(--white); border-radius: var(--radius-lg); padding: 2rem; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-family: var(--font-serif); color: var(--navy); margin-bottom: 1.5rem; }
    .modal .form-group { margin-bottom: 1rem; }
    .modal label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .modal-actions .btn { flex: 1; }
  </style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script><script defer src="/_vercel/insights/script.js"></script>

<body>

      <circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/>
    </svg>
  </button>
  <div class="tp-panel" id="tp-panel" role="group" aria-label="Choose a theme">
    <div class="tp-head">
      <div class="tp-title">Choose your ambience</div>
      <div class="tp-sub">Eight walnut shades. Saved automatically.</div>
    </div>

      <button class="tp-opt" data-theme-btn="walnut-ivory" type="button" style="--sw:#F8F4EC"><span class="tp-swatch"></span><span class="tp-name">Ivory</span></button>
      <button class="tp-opt" data-theme-btn="walnut-cream" type="button" style="--sw:#EDE6D8"><span class="tp-swatch"></span><span class="tp-name">Cream</span></button>
      <button class="tp-opt active" data-theme-btn="walnut-latte" type="button" style="--sw:#D2C7AF"><span class="tp-swatch"></span><span class="tp-name">Latte</span></button>
      <button class="tp-opt" data-theme-btn="walnut-sand" type="button" style="--sw:#B3A488"><span class="tp-swatch"></span><span class="tp-name">Sand</span></button>
      <button class="tp-opt" data-theme-btn="walnut-tan" type="button" style="--sw:#665A46"><span class="tp-swatch"></span><span class="tp-name">Tan</span></button>
      <button class="tp-opt" data-theme-btn="walnut-mid" type="button" style="--sw:#524736"><span class="tp-swatch"></span><span class="tp-name">Mid</span></button>
      <button class="tp-opt" data-theme-btn="walnut-soft" type="button" style="--sw:#3F3629"><span class="tp-swatch"></span><span class="tp-name">Soft</span></button>
      <button class="tp-opt" data-theme-btn="walnut" type="button" style="--sw:#2E261D"><span class="tp-swatch"></span><span class="tp-name">Walnut</span></button>

</div>
  <div class="admin-overlay" onclick="toggleSidebar()"></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-header">
        <div class="admin-logo">
          <a href="dashboard.html">
            <span class="admin-logo-icon">🌿</span>
            <h2>Moow<span>.</span>Hub®</h2>
          </a>
          <p style="font-size:0.8rem;opacity:0.7;margin:0.25rem 0 0;">Admin Panel</p>
        </div>
        <button class="admin-toggle" onclick="toggleSidebar()" aria-label="Close menu">&times;</button>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="orders.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          Orders
        </a>
        <a href="products.html" class="admin-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Products
        </a>
        <a href="customers.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Customers
        </a>
        <a href="partners.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Partners
        </a>
        <a href="../products.html" class="admin-nav-item" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Store
        </a>
        <div style="border-top:1px solid rgba(255,255,255,0.1);margin:1rem 1rem 0.5rem;"></div>
        <a href="#" class="admin-nav-item" onclick="Auth.logout();return false;" style="color:rgba(255,255,255,0.5);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Logout
        </a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <button class="admin-toggle" onclick="toggleSidebar()" aria-label="Open menu" style="color:var(--navy);">&#9776;</button>
          <h1>Products</h1>
        </div>
        <button class="btn btn-primary" onclick="openModal()">+ Add Product</button>
      </div>

      <div class="admin-table">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Featured</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsTable">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal-overlay">
    <div class="modal">
      <h2 id="modalTitle">Add Product</h2>
      <input type="hidden" id="productId">
      
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="productName" required>
      </div>
      
      <div class="form-group">
        <label>Category *</label>
        <select id="productCategory">
          <option value="apparel">Apparel</option>
          <option value="kits">Kits</option>
          <option value="print">Print Materials</option>
          <option value="accessories">Accessories</option>
          <option value="ayurveda">Ayurveda, Siddha &amp; Herbal</option>
          <option value="supplements">Health Supplements</option>
          <option value="books">Books</option>
          <option value="digital">Digital Programs</option>
          <option value="services">Corporate Wellness &amp; Consulting</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription"></textarea>
      </div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label>Price (USD) *</label>
          <input type="number" id="productPrice" step="0.01" required>
        </div>
        <div class="form-group">
          <label>Stock *</label>
          <input type="number" id="productStock" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" id="productImage" placeholder="images/product.jpg">
      </div>
      
      <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
        <input type="checkbox" id="productFeatured" style="width:auto;padding:0;margin:0;">
        <label for="productFeatured" style="margin:0;font-size:0.9rem;">Featured Product</label>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save Product</button>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() { document.getElementById('adminSidebar').classList.toggle('open'); document.querySelector('.admin-overlay').classList.toggle('show'); }
  </script>
  <script src="../../js/auth.js"></script>
  <script>
    (function() {
      if (!Auth.isAuthenticated() || !Auth.isAdmin()) {
        window.location.href = '/pages/login.html';
        return;
      }
      var allProducts = [];
      loadProducts();
      document.getElementById('cancelBtn').addEventListener('click', closeModal);
      document.getElementById('saveBtn').addEventListener('click', saveProduct);
    })();

    async function loadProducts() {
      const tbody = document.getElementById('productsTable');
      try {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>';
        const response = await Auth.authenticatedFetch('/api/admin/products');
        if (!response || !response.ok) throw new Error('Failed');

        const data = await response.json();
        allProducts = data.data || [];
        renderProducts(allProducts);
      } catch (error) {
        console.error('Load products error:', error);
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#dc3545;">Failed to load products. <button onclick="loadProducts()" style="background:none;border:none;color:var(--primary);cursor:pointer;text-decoration:underline;">Retry</button></td></tr>';
      }
    }

    function capitalize(str) { return str ? str.replace(/\b\w/g, c => c.toUpperCase()) : ''; }

    function renderProducts(products) {
      const tbody = document.getElementById('productsTable');

      if (products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">No products found</td></tr>';
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td><img src="../../${p.image_url}" alt="${p.name.replace(/"/g, '&quot;')}" class="product-thumb" onerror="this.src='../../images/placeholder.svg';this.onerror=null;"></td>
          <td><strong>${p.name}</strong></td>
          <td>${capitalize(p.category)}</td>
          <td>$${Number(p.price_usd).toFixed(2)}</td>
          <td class="${p.stock <= 5 ? 'stock-low' : 'stock-ok'}">${p.stock}</td>
          <td>${p.featured ? '&#10003;' : '-'}</td>
          <td>
            <button class="action-btn action-btn-primary" onclick="editProduct('${p.id}')">Edit</button>
            <button class="action-btn action-btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openModal(product = null) {
      document.getElementById('productModal').style.display = 'flex';
      
      if (product) {
        document.getElementById('modalTitle').textContent = 'Edit Product';
        document.getElementById('productId').value = product.id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productCategory').value = product.category;
        document.getElementById('productDescription').value = product.description || '';
        document.getElementById('productPrice').value = product.price_usd;
        document.getElementById('productStock').value = product.stock;
        document.getElementById('productImage').value = product.image_url || '';
        document.getElementById('productFeatured').checked = product.featured;
      } else {
        document.getElementById('modalTitle').textContent = 'Add Product';
        document.getElementById('productId').value = '';
        document.getElementById('productName').value = '';
        document.getElementById('productDescription').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productStock').value = '';
        document.getElementById('productImage').value = '';
        document.getElementById('productFeatured').checked = false;
      }
    }

    function closeModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    function editProduct(id) {
      const product = allProducts.find(p => p.id === id);
      if (product) openModal(product);
    }

    async function saveProduct() {
      try {
        const idEl = document.getElementById('productId');
        const nameEl = document.getElementById('productName');
        const catEl = document.getElementById('productCategory');
        const descEl = document.getElementById('productDescription');
        const priceEl = document.getElementById('productPrice');
        const stockEl = document.getElementById('productStock');
        const imgEl = document.getElementById('productImage');
        const featEl = document.getElementById('productFeatured');

        if (!nameEl || !priceEl) {
          alert('Form elements not found. Please refresh the page.');
          return;
        }

        const id = idEl ? idEl.value : '';
        const price = parseFloat(priceEl.value);
        const stock = parseInt(stockEl.value);

        if (!nameEl.value || isNaN(price)) {
          alert('Please fill in required fields (Name and Price)');
          return;
        }

        const productData = {
          name: nameEl.value,
          category: catEl ? catEl.value : '',
          description: descEl ? descEl.value : '',
          price_usd: price,
          stock: isNaN(stock) ? 0 : stock,
          image_url: imgEl ? (imgEl.value || 'images/placeholder.jpg') : 'images/placeholder.jpg',
          featured: featEl ? featEl.checked : false
        };

        const method = id ? 'PUT' : 'POST';
        const body = id ? JSON.stringify(Object.assign({ id }, productData)) : JSON.stringify(productData);
        console.log('[saveProduct] method:', method, 'id:', JSON.stringify(id), 'body preview:', body.substring(0, 120));

        const response = await Auth.authenticatedFetch('/api/admin/products', {
          method,
          body
        });
        console.log('[saveProduct] response status:', response?.status);

        if (!response) {
          alert('Session expired. Please log out and log back in.');
          return;
        }

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          console.log('[saveProduct] ERROR response:', errData);
          alert('Failed to save product: ' + (errData.error || response.statusText || 'Unknown error'));
          return;
        }

        closeModal();
        await loadProducts();
      } catch (error) {
        console.error('saveProduct error:', error);
        alert('Failed to save product: ' + (error.message || 'Unknown error'));
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product? This action cannot be undone.')) return;

      try {
        const response = await Auth.authenticatedFetch(`/api/admin/products?id=${id}`, {
          method: 'DELETE'
        });

        if (!response || !response.ok) {
          alert('Failed to delete product');
          return;
        }

        loadProducts();
      } catch (error) {
        alert('Failed to delete product');
      }
    }
  </script>
  <script defer src="../../js/main.js"></script>
</body>
</html>
