  <style>
    * { box-sizing: border-box; }
    .admin-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--navy); color: white; padding: 2rem 0; }
    .admin-logo { padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
    .admin-logo a { color: white; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .admin-logo h2 { color: white; font-family: var(--font-serif); font-size: 1.3rem; margin: 0; }
    .admin-logo span { color: var(--primary); }
    .admin-logo-icon { font-size: 1.5rem; flex-shrink: 0; }
    .admin-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; }
    @media (max-width: 768px) {
      .admin-toggle { display: block; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; z-index: 2000; transition: left 0.3s ease; overflow-y: auto; }
      .admin-sidebar.open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.2); }
      .admin-sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
      .admin-sidebar-header .admin-logo { padding: 0; border-bottom: none; margin-bottom: 0; }
      .admin-sidebar-header .admin-toggle { color: white; font-size: 1.5rem; }
      .admin-main { padding: 1rem; }
      .admin-table table { min-width: 500px; }
      .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1999; }
      .admin-overlay.show { display: block; }
    }
    .admin-nav { padding: 0 1rem; }
    .admin-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; color: rgba(255,255,255,0.7); border-radius: var(--radius); margin-bottom: 0.25rem; cursor: pointer; transition: var(--transition); font-size: 0.9rem; text-decoration: none; }
    .admin-nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .admin-nav-item.active { background: var(--primary); color: white; }
    .admin-nav-item svg { width: 18px; height: 18px; }
    .admin-main { padding: 2rem; background: var(--bg); min-height: 100vh; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-family: var(--font-serif); color: var(--navy); margin: 0; }
    .admin-table { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .admin-table > div { overflow-x: auto; }
    .admin-table table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .admin-table th { background: var(--bg); padding: 1rem; text-align: left; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .admin-table td { padding: 1rem; border-bottom: 1px solid var(--border-light); font-size: 0.9rem; }
    .admin-table tr:hover td { background: var(--bg); }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: var(--radius-pill); font-size: 0.7rem; font-weight: 600; }
    .badge-admin { background: #dc3545; color: white; }
    .badge-partner { background: #ffc107; color: #333; }
    .search-bar { display: flex; gap: 0.5rem; align-items: center; }
    .search-bar input { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; width: 250px; }
    .search-bar button { padding: 0.5rem 1rem; background: var(--navy); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; }
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
    .pagination button { padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; }
    .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .role-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100000;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.97);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      font-size: 0.85rem;
      font-family: var(--font-body);
      line-height: 1.45;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .role-toast.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .role-toast-icon { flex-shrink: 0; color: #28a745; display: inline-flex; }
    .role-toast strong { color: var(--primary); }
    .role-toast-close { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1.2rem; cursor: pointer; padding: 0 2px; line-height: 1; margin-left: auto; flex-shrink: 0; }
    .role-toast-close:hover { color: #fff; }
    @media (max-width: 768px) {
      .role-toast {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
        align-items: flex-start;
      }
    }
  </style>

      <div class="admin-header">
        <div style="display:flex;align-items:center;gap:0.75rem;">

          <h1>Customers</h1>
        </div>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search by name..." onkeydown="if(event.key==='Enter')loadCustomers(1)">
          <button onclick="loadCustomers(1)">Search</button>

              <th>Actions</th>

  <script>
    function toggleSidebar() { document.getElementById('adminSidebar').classList.toggle('open'); document.querySelector('.admin-overlay').classList.toggle('show'); }
  </script>
  <script src="../../js/auth.js"></script>
  <script>
    var currentPage;

    (function() {
      if (!Auth.isAuthenticated() || !Auth.isAdmin()) {
        window.location.href = '/pages/login.html';
        return;
      }
      currentPage = 1;
      loadCustomers(1);
    })();

    async function loadCustomers(page) {
      currentPage = page;
      const tbody = document.getElementById('customersTable');
      const search = document.getElementById('searchInput').value.trim();

      try {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">' + (search ? 'Searching...' : 'Loading...') + '</td></tr>';
        const params = new URLSearchParams({ page, limit: 20, _t: Date.now() });
        if (search) params.set('search', search);
        const response = await Auth.authenticatedFetch('/api/admin/customers?' + params.toString());
        if (!response || !response.ok) {
          const errText = response ? await response.text().catch(() => '') : 'Not authenticated';
          throw new Error(errText || ('HTTP ' + response?.status));
        }

        const body = await response.json();
        const customers = body.data || [];
        const total = body.pagination?.total || 0;
        const totalPages = Math.ceil(total / 20);
        console.log('Customers API:', { count: customers.length, total, page, body });

        if (customers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No customers found</td></tr>';
        } else {
          tbody.innerHTML = customers.map(c => {
            return `
            <tr>
              <td><strong>${c.full_name}</strong></td>
              <td>${c.email || '-'}</td>
              <td>${c.phone || '-'}</td>
              <td>${c.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''} ${c.is_partner ? '<span class="badge badge-partner">Partner</span>' : ''} ${!c.is_admin && !c.is_partner ? '<span style="color:var(--text-muted);font-size:0.85rem;">User</span>' : ''}</td>
              <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : '-'}</td>
              <td style="white-space:nowrap;">
                <label style="display:inline-flex;align-items:center;gap:0.25rem;margin-right:0.5rem;font-size:0.8rem;cursor:pointer;">
                  <input type="checkbox" onclick="updateCustomerRole('${c.id}', this)" ${c.is_admin ? 'checked' : ''} value="admin"> Admin
                </label>
                <label style="display:inline-flex;align-items:center;gap:0.25rem;margin-right:0.5rem;font-size:0.8rem;cursor:pointer;">
                  <input type="checkbox" onclick="updateCustomerRole('${c.id}', this)" ${c.is_partner ? 'checked' : ''} value="partner"> Partner
                </label>
                <label style="display:inline-flex;align-items:center;gap:0.25rem;font-size:0.8rem;cursor:pointer;color:var(--text-muted);">
                  <input type="checkbox" onclick="updateCustomerRole('${c.id}', this)" ${!c.is_admin && !c.is_partner ? 'checked' : ''} value="user"> User
                </label>
              </td>
            </tr>
          `}).join('');
        }

        renderPagination(totalPages);
      } catch (error) {
        console.error('Load customers error:', error);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#dc3545;">Failed to load customers: ' + error.message + '</td></tr>';
      }
    }

    async function updateCustomerRole(userId, checkbox) {
      if (!userId || !checkbox) return;
      var tr = checkbox.closest('tr');
      if (!tr) { console.error('updateCustomerRole: no parent row'); return; }
      var adminBox = tr.querySelector('input[value="admin"]');
      var partnerBox = tr.querySelector('input[value="partner"]');
      var userBox = tr.querySelector('input[value="user"]');
      if (!adminBox || !partnerBox || !userBox) { console.error('updateCustomerRole: missing checkboxes'); return; }

      if (checkbox.value === 'admin' && checkbox.checked) {
        userBox.checked = false;
      }
      if (checkbox.value === 'partner' && checkbox.checked) {
        userBox.checked = false;
      }
      if (checkbox.value === 'user' && checkbox.checked) {
        adminBox.checked = false;
        partnerBox.checked = false;
      }
      if (!adminBox.checked && !partnerBox.checked) {
        userBox.checked = true;
      }

      try {
        const response = await Auth.authenticatedFetch('/api/admin/customers', {
          method: 'PUT',
          body: JSON.stringify({ id: userId, is_admin: adminBox.checked, is_partner: partnerBox.checked })
        });
        if (!response || !response.ok) {
          if (response) {
            const text = await response.text().catch(() => '');
            console.error('updateCustomerRole API error:', response.status, text);
          }
          loadCustomers(currentPage);
          return;
        }
        var roleCell = tr.cells[3];
        if (roleCell) {
          roleCell.innerHTML =
            (adminBox.checked ? '<span class="badge badge-admin">Admin</span> ' : '') +
            (partnerBox.checked ? '<span class="badge badge-partner">Partner</span> ' : '') +
            (!adminBox.checked && !partnerBox.checked ? '<span style="color:var(--text-muted);font-size:0.85rem;">User</span>' : '');
        }
        var nameCell = tr.cells[0];
        var displayName = nameCell ? nameCell.textContent.trim() : 'This user';
        var roleLabel = adminBox.checked && partnerBox.checked ? 'Admin &amp; Partner' : (adminBox.checked ? 'Admin' : partnerBox.checked ? 'Partner' : 'User');
        showRoleToast(escapeHtml(displayName) + ' was set to <strong>' + roleLabel + '</strong>. They must log out and log back in for the change to take effect.');
      } catch (error) {
        console.error('updateCustomerRole error:', error);
        loadCustomers(currentPage);
      }
    }

    var roleToastTimer = null;
    function showRoleToast(message) {
      var existing = document.getElementById('role-toast');
      if (existing) existing.remove();
      var el = document.createElement('div');
      el.id = 'role-toast';
      el.className = 'role-toast';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.innerHTML =
        '<span class="role-toast-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
        '</span>' +
        '<span>' + message + '</span>' +
        '<button class="role-toast-close" type="button" aria-label="Dismiss">&times;</button>';
      document.body.appendChild(el);
      requestAnimationFrame(function() { el.classList.add('visible'); });
      el.querySelector('.role-toast-close').addEventListener('click', function() { hideRoleToast(el); });
      clearTimeout(roleToastTimer);
      roleToastTimer = setTimeout(function() { hideRoleToast(el); }, 8000);
    }

    function hideRoleToast(el) {
      if (!el) el = document.getElementById('role-toast');
      if (!el) return;
      el.classList.remove('visible');
      setTimeout(function() { el.remove(); }, 300);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = '<button onclick="loadCustomers(1)"' + (currentPage === 1 ? ' disabled' : '') + '>&laquo;</button>';
      for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
        html += '<button onclick="loadCustomers(' + i + ')"' + (i === currentPage ? ' class="active"' : '') + '>' + i + '</button>';
      }
      html += '<button onclick="loadCustomers(' + totalPages + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>&raquo;</button>';
      el.innerHTML = html;
    }
  </script>
