<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — Moow.Hub Admin</title>
  <meta name="description" content="Manage Moow.Hub customer accounts.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    * { box-sizing: border-box; }
    .admin-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--navy); color: white; padding: 2rem 0; }
    .admin-logo { padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
    .admin-logo h2 { color: white; font-family: var(--font-serif); font-size: 1.3rem; margin: 0; }
    .admin-logo span { color: var(--primary); }
    .admin-nav { padding: 0 1rem; }
    .admin-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; color: rgba(255,255,255,0.7); border-radius: var(--radius); margin-bottom: 0.25rem; cursor: pointer; transition: var(--transition); font-size: 0.9rem; text-decoration: none; }
    .admin-nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .admin-nav-item.active { background: var(--primary); color: white; }
    .admin-nav-item svg { width: 18px; height: 18px; }
    .admin-main { padding: 2rem; background: var(--bg); min-height: 100vh; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-family: var(--font-serif); color: var(--navy); margin: 0; }
    .admin-table { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .admin-table > div { overflow-x: auto; }
    .admin-table table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .admin-table th { background: var(--bg); padding: 1rem; text-align: left; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .admin-table td { padding: 1rem; border-bottom: 1px solid var(--border-light); font-size: 0.9rem; }
    .admin-table tr:hover td { background: var(--bg); }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: var(--radius-pill); font-size: 0.7rem; font-weight: 600; }
    .badge-admin { background: #dc3545; color: white; }
    .badge-partner { background: #ffc107; color: #333; }
    .search-bar { display: flex; gap: 0.5rem; align-items: center; }
    .search-bar input { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; width: 250px; }
    .search-bar button { padding: 0.5rem 1rem; background: var(--navy); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; }
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
    .pagination button { padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; }
    .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script><script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <h2>Moow<span>.</span>Hub</h2>
        <p style="font-size:0.8rem;opacity:0.7;margin:0.25rem 0 0;">Admin Panel</p>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="orders.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          Orders
        </a>
        <a href="products.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Products
        </a>
        <a href="customers.html" class="admin-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Customers
        </a>
        <a href="../products.html" class="admin-nav-item" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Store
        </a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Customers</h1>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search by name..." onkeydown="if(event.key==='Enter')loadCustomers(1)">
          <button onclick="loadCustomers(1)">Search</button>
        </div>
      </div>

      <div class="admin-table">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="customersTable">
            <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <script defer src="../../js/auth.js"></script>
  <script>
    let currentPage = 1;

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.isAuthenticated() || !Auth.isAdmin()) {
        window.location.href = '/pages/login.html';
        return;
      }
      loadCustomers(1);
    });

    async function loadCustomers(page) {
      currentPage = page;
      const tbody = document.getElementById('customersTable');
      const search = document.getElementById('searchInput').value.trim();

      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">' + (search ? 'Searching...' : 'Loading...') + '</td></tr>';

      try {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">' + (search ? 'Searching...' : 'Loading...') + '</td></tr>';
        const params = new URLSearchParams({ page, limit: 20 });
        if (search) params.set('search', search);
        const response = await Auth.authenticatedFetch('/api/admin/customers?' + params.toString());
        if (!response || !response.ok) {
          const errText = response ? await response.text().catch(() => '') : 'Not authenticated';
          throw new Error(errText || ('HTTP ' + response?.status));
        }

        const body = await response.json();
        const customers = body.data || [];
        const total = body.pagination?.total || 0;
        const totalPages = Math.ceil(total / 20);

        if (customers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No customers found</td></tr>';
        } else {
          tbody.innerHTML = customers.map(c => `
            <tr>
              <td><strong>${c.full_name}</strong></td>
              <td>${c.email || '-'}</td>
              <td>${c.phone || '-'}</td>
              <td>${c.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''} ${c.is_partner ? '<span class="badge badge-partner">Partner</span>' : ''} ${!c.is_admin && !c.is_partner ? '<span style="color:var(--text-muted);font-size:0.85rem;">User</span>' : ''}</td>
              <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : '-'}</td>
            </tr>
          `).join('');
        }

        renderPagination(totalPages);
      } catch (error) {
        console.error('Load customers error:', error);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#dc3545;">Failed to load customers: ' + error.message + '</td></tr>';
      }
    }

    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = '<button onclick="loadCustomers(1)"' + (currentPage === 1 ? ' disabled' : '') + '>&laquo;</button>';
      for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
        html += '<button onclick="loadCustomers(' + i + ')"' + (i === currentPage ? ' class="active"' : '') + '>' + i + '</button>';
      }
      html += '<button onclick="loadCustomers(' + totalPages + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>&raquo;</button>';
      el.innerHTML = html;
    }
  </script>
</body>
</html>
