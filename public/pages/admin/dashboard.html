<!DOCTYPE html>
<html lang="en" data-theme="walnut-latte">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Moow.Hub</title>
  <meta name="description" content="Moow.Hub administrator dashboard for managing products, orders, and site operations.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css?v=9">
  <style>
    * { box-sizing: border-box; }
    .admin-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    
    /* Sidebar */
    .admin-sidebar { background: var(--navy); color: white; padding: 2rem 0; }
    .admin-logo { padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
    .admin-logo a { color: white; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .admin-logo h2 { color: white; font-family: var(--font-serif); font-size: 1.3rem; margin: 0; }
    .admin-logo span { color: var(--primary); }
    .admin-logo-icon { font-size: 1.5rem; flex-shrink: 0; }
    
    .admin-nav { padding: 0 1rem; }
    .admin-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; color: rgba(255,255,255,0.7); border-radius: var(--radius); margin-bottom: 0.25rem; cursor: pointer; transition: var(--transition); font-size: 0.9rem; text-decoration: none; }
    .admin-nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .admin-nav-item.active { background: var(--primary); color: white; }
    .admin-nav-item svg { width: 18px; height: 18px; }
    
    /* Main content */
    .admin-main { padding: 2rem; background: var(--bg); min-height: 100vh; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-family: var(--font-serif); color: var(--navy); margin: 0; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm); }
    .date-filter-bar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .date-filter-bar label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
    .date-filter-bar input[type="date"] { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.85rem; font-family: var(--font-body); color: var(--text); background: var(--white); }
    .date-filter-bar input[type="date"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 94, 98, 0.1); }
    .date-filter-bar .date-btn { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .date-filter-bar .date-btn:hover { background: #e94b4f; }
    .stat-card-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
    .stat-card-value { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; color: var(--navy); }

    /* Table */
    .admin-table { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .admin-table > div { overflow-x: auto; }
    .admin-table table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .admin-table th { background: var(--bg); padding: 1rem; text-align: left; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .admin-table td { padding: 1rem; border-bottom: 1px solid var(--border-light); font-size: 0.9rem; }
    .admin-table tr:hover td { background: var(--bg); }
    .status-badge { padding: 0.25rem 0.75rem; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d1ecf1; color: #0c5460; }
    .status-processing { background: #cce5ff; color: #004085; }
    .status-shipped { background: #d4edda; color: #155724; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }
    .action-btn { padding: 0.4rem 0.8rem; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; transition: var(--transition); display: inline-block; text-decoration: none; }
    .action-btn-primary { background: var(--primary); color: white; }

    /* Low stock alert */
    .alert-card { background: #fff3cd; border: 1px solid #ffc107; border-radius: var(--radius); padding: 1rem 1.5rem; margin-bottom: 2rem; }
    .alert-card h4 { color: #856404; margin: 0 0 0.25rem; font-size: 1rem; }
    .alert-card p { color: #856404; margin: 0; font-size: 0.9rem; }

    /* Admin hamburger toggle */
    .admin-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; }
    @media (max-width: 768px) {
      .admin-toggle { display: block; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; z-index: 2000; transition: left 0.3s ease; overflow-y: auto; }
      .admin-sidebar.open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.2); }
      .admin-sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; }
      .admin-sidebar-header .admin-logo { padding: 0; border-bottom: none; margin-bottom: 0; }
      .admin-sidebar-header .admin-toggle { color: white; font-size: 1.5rem; }
      .admin-main { padding: 1rem; }
      .stats-row { grid-template-columns: 1fr; }
      .admin-table table { min-width: 500px; }
      .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1999; }
      .admin-overlay.show { display: block; }
    }
  </style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script><script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="admin-overlay" onclick="toggleSidebar()"></div>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-header">
        <div class="admin-logo">
          <a href="dashboard.html">
            <span class="admin-logo-icon">🌿</span>
            <h2>Moow<span>.</span>Hub®</h2>
          </a>
          <p style="font-size:0.8rem;opacity:0.7;margin:0.25rem 0 0;">Admin Panel</p>
          <p style="font-size:0.85rem;margin:0.5rem 0 0;color:rgba(255,255,255,0.8);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="adminUser"></p>
        </div>
        <button class="admin-toggle" onclick="toggleSidebar()" aria-label="Close menu">&times;</button>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="orders.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          Orders
        </a>
        <a href="products.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Products
        </a>
        <a href="customers.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Customers
        </a>
        <a href="partners.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Partners
        </a>
        <a href="../products.html" class="admin-nav-item" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Store
        </a>
        <div style="border-top:1px solid rgba(255,255,255,0.1);margin:1rem 1rem 0.5rem;"></div>
        <a href="#" class="admin-nav-item" onclick="Auth.logout();return false;" style="color:rgba(255,255,255,0.5);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Logout
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <button class="admin-toggle" onclick="toggleSidebar()" aria-label="Open menu" style="color:var(--navy);">&#9776;</button>
          <h1>Dashboard</h1>
        </div>
      </div>

      <!-- Date Filter -->
      <div class="date-filter-bar">
        <label for="dateFrom">From:</label>
        <input type="date" id="dateFrom">
        <label for="dateTo">To:</label>
        <input type="date" id="dateTo">
        <button class="date-btn" id="applyDateBtn">Apply</button>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-label">Total Orders</div>
          <div class="stat-card-value" id="statOrders">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Total Products</div>
          <div class="stat-card-value" id="statProducts">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Total Customers</div>
          <div class="stat-card-value" id="statUsers">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Revenue (30 days)</div>
          <div class="stat-card-value" id="statRevenue">-</div>
        </div>
      </div>

      <!-- Low Stock Alert -->
      <div id="lowStockAlert" style="display:none;"></div>

      <!-- Recent Orders -->
      <div class="admin-table">
        <div style="padding:1rem;border-bottom:1px solid var(--border-light);">
          <h3 style="font-family:var(--font-serif);color:var(--navy);margin:0;">Recent Orders</h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="recentOrdersTable">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() { document.getElementById('adminSidebar').classList.toggle('open'); document.querySelector('.admin-overlay').classList.toggle('show'); }
  </script>
  <script src="../../js/auth.js"></script>
  <script>
    async function loadDashboard() {
      try {
        var from = document.getElementById('dateFrom').value;
        var to = document.getElementById('dateTo').value;
        var params = new URLSearchParams();
        if (from) params.append('from', from);
        if (to) params.append('to', to);
        const response = await Auth.authenticatedFetch('/api/admin/dashboard?' + params.toString());
        if (!response || !response.ok) throw new Error('Failed to load');

        const data = await response.json();
        const { stats, ordersByStatus, recentOrders, lowStockProducts } = data.data;

        // Update stats
        document.getElementById('statOrders').textContent = stats.totalOrders;
        document.getElementById('statProducts').textContent = stats.totalProducts;
        document.getElementById('statUsers').textContent = stats.totalUsers;
        document.getElementById('statRevenue').textContent = '$' + stats.revenue30Days.toLocaleString();

        // Low stock alert
        if (lowStockProducts.length > 0) {
          const alertDiv = document.getElementById('lowStockAlert');
          alertDiv.style.display = 'block';
          alertDiv.innerHTML = `
            <div class="alert-card">
              <h4>Low Stock Alert</h4>
              <p>${lowStockProducts.length} product(s) have 5 or less items in stock</p>
            </div>
          `;
        }

        // Recent orders table
        const tbody = document.getElementById('recentOrdersTable');
        if (recentOrders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No orders yet</td></tr>';
          return;
        }

        var STATUS_LABELS = { pending:'Pending', confirmed:'Confirmed', processing:'Processing', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };

        tbody.innerHTML = recentOrders.map(order => {
          const date = new Date(order.created_at).toLocaleDateString();
          const statusClass = 'status-' + order.status;
          const statusLabel = STATUS_LABELS[order.status] || order.status;
          
          return `
            <tr>
              <td><strong>${order.order_number}</strong></td>
              <td>${order.customer || 'Unknown'}</td>
              <td>$${Number(order.total).toFixed(2)}</td>
              <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
              <td>${date}</td>
              <td><a href="../order-detail.html?id=${order.id}" class="action-btn action-btn-primary">View</a></td>
            </tr>
          `;
        }).join('');

      } catch (error) {
        console.error('Dashboard load error:', error);
        document.getElementById('statOrders').textContent = 'Error';
        document.getElementById('statProducts').textContent = 'Error';
        document.getElementById('statUsers').textContent = 'Error';
        document.getElementById('statRevenue').textContent = 'Error';
      }
    }

    (function() {
      if (!Auth.isAuthenticated() || !Auth.isAdmin()) {
        window.location.href = '/pages/login.html';
        return;
      }

      var from = new Date();
      from.setDate(from.getDate() - 30);
      document.getElementById('dateFrom').value = from.toISOString().split('T')[0];
      document.getElementById('dateTo').value = new Date().toISOString().split('T')[0];

      var user = Auth.getUser();
      var nameEl = document.getElementById('adminUser');
      if (nameEl && user) nameEl.textContent = user.full_name || user.email || '';

      document.getElementById('applyDateBtn').addEventListener('click', loadDashboard);

      loadDashboard();
    })();
  </script>
</body>
</html>
